name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  sonoma-sleep-sim:
    name: Sonoma 14 Sleep/Wake Simulation
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build (debug)
        run: swift build -c debug
      - name: Suspension, recovery and lifecycle tests
        run: |
          swift test --filter 'Suspension|Recovery|Lifecycle' 2>&1 | tee /tmp/sonoma-sim.log
          exit ${PIPESTATUS[0]}
      - name: SIGSTOP/SIGCONT host freeze test
        run: |
          MARKER=/tmp/stopcont.marker
          rm -f "$MARKER"
          touch "$MARKER"
          SUSPENSION_HOST_SPIN=long SUSPENSION_HOST_MARKER="$MARKER" \
            swift test --filter 'testSuspensionHostSurvivesStopCont' > /tmp/stopcont.log 2>&1 &
          PID=$!
          PATTERN='WarawaraPetPackageTests|xctest'
          trap 'pkill -CONT -f "$PATTERN" 2>/dev/null || true' EXIT
          for i in $(seq 1 360); do
            if grep -q "SUSPENSION_HOST_BEGIN" "$MARKER" 2>/dev/null; then break; fi
            if ! kill -0 $PID 2>/dev/null; then break; fi
            sleep 1
          done
          if ! grep -q "SUSPENSION_HOST_BEGIN" "$MARKER" 2>/dev/null; then
            echo "host test never reached the spin loop"; cat /tmp/stopcont.log; exit 1
          fi
          # Freeze the test runner by process name (never the CI
          # script's own process group) and verify it is really stopped
          # before and after the 8 s pause.
          echo "=== process table ==="
          ps -axo pid,ppid,state,comm,args | grep -iE 'xctest|WarawaraPet|swift test' | head -n 20
          pkill -STOP -f "$PATTERN" || { echo "STOP failed"; exit 1; }
          sleep 1
          RUNNER=$(pgrep -f "$PATTERN" | head -n 1)
          STATE=$(ps -o state= -p "$RUNNER" | tr -d ' ')
          case "$STATE" in
            T*) ;;
            *) echo "runner not in stopped state (state=$STATE)"; exit 1 ;;
          esac
          # The freeze proof: the runner must stay stopped (state T)
          # for the ENTIRE 8 s window. SIGSTOP can only be undone by
          # SIGCONT, and nothing else sends CONT here, so observing T at
          # both ends proves a genuine >= 8 s freeze.
          sleep 8
          STATE=$(ps -o state= -p "$RUNNER" | tr -d ' ')
          case "$STATE" in
            T*) ;;
            *) echo "runner did not stay stopped for the 8s window (state=$STATE)"; exit 1 ;;
          esac
          pkill -CONT -f "$PATTERN" || { echo "CONT failed"; exit 1; }
          sleep 1
          STATE=$(ps -o state= -p "$RUNNER" | tr -d ' ')
          case "$STATE" in
            T*) echo "runner still stopped after CONT (state=$STATE)"; exit 1 ;;
          esac
          trap - EXIT
          for i in $(seq 1 120); do
            if ! kill -0 $PID 2>/dev/null; then break; fi
            sleep 1
          done
          wait $PID
          STATUS=$?
          if [ $STATUS -ne 0 ]; then echo "HOST_FAILED status=$STATUS"; cat /tmp/stopcont.log; exit 1; fi
          grep -q "SUSPENSION_HOST_BEGIN" "$MARKER" || { echo "no BEGIN"; cat /tmp/stopcont.log; exit 1; }
          grep -q "SUSPENSION_HOST_END" "$MARKER" || { echo "no END (stuck?)"; cat /tmp/stopcont.log; exit 1; }
          COUNTER=$(grep -o 'counter=[0-9]*' "$MARKER" | head -n 1 | cut -d= -f2)
          if [ -z "$COUNTER" ] || [ "$COUNTER" -le 0 ]; then
            echo "the spin produced no iterations (counter=$COUNTER)"; cat /tmp/stopcont.log; exit 1
          fi
          WALL=$(grep -o 'wallDelta=[0-9.]*' "$MARKER" | head -n 1 | cut -d= -f2)
          echo "measured wallDelta=$WALL counter=$COUNTER"
          echo "STOPCONT_OK wallDelta=$WALL counter=$COUNTER"
      - name: Upload simulation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sonoma14-SleepWake-Simulation-Logs
          path: |
            /tmp/sonoma-sim.log
            /tmp/stopcont.log
            /tmp/stopcont.marker
          if-no-files-found: ignore

  sonoma-check:
    name: macOS 14 Sonoma build + tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build (Sonoma 14)
        run: swift build -c release
      - name: Run unit tests (Sonoma 14)
        run: swift test

  build-and-test:
    name: Build, test, and package
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build (universal)
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Run unit tests
        run: swift test

      - name: Generate sleep/mouth continuity previews
        run: swift test --filter SleepMouthPreviewGeneratorTests
        env:
          SLEEP_PREVIEW_OUT: dist/sleep-preview

      - name: Generate art previews
        run: swift test --filter ArtPreviewGeneratorTests
        env:
          ART_PREVIEW_OUT: dist/art-preview

      - name: Generate birthday previews
        run: swift test --filter BirthdayPreviewGeneratorTests
        env:
          BIRTHDAY_PREVIEW_OUT: dist/birthday-preview

      - name: Generate gift previews
        run: swift test --filter GiftPreviewGeneratorTests
        env:
          GIFT_PREVIEW_OUT: dist/gift-preview

      - name: Package .app and zip
        run: bash Scripts/package-app.sh

      - name: Verify packaged app loads sprites
        run: |
          OUTPUT="$("dist/WarawaraPet.app/Contents/MacOS/WarawaraPet" --verify-sprites)"
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "SPRITES_OK" || { echo "sprites not loaded"; exit 1; }
          echo "$OUTPUT" | grep -q "rig=loaded" || { echo "layered rig not loaded"; exit 1; }
          BIRTHDAY="$("dist/WarawaraPet.app/Contents/MacOS/WarawaraPet" --verify-birthday)"
          echo "$BIRTHDAY"
          echo "$BIRTHDAY" | grep -q "BIRTHDAY_OK" || { echo "birthday assets not loaded"; exit 1; }
          GIFTS="$("dist/WarawaraPet.app/Contents/MacOS/WarawaraPet" --verify-gift-assets)"
          echo "$GIFTS"
          echo "$GIFTS" | grep -q "GIFT_ASSETS_OK" || { echo "gift assets not loaded"; exit 1; }

      - name: Smoke-test meteor replay (packaged app)
        run: |
          BIN="dist/WarawaraPet.app/Contents/MacOS/WarawaraPet"
          echo "== replay-smoke meteor =="
          "$BIN" --replay-smoke > "/tmp/meteor-smoke.log" 2>&1 &
          PID=$!
          for i in $(seq 1 60); do
            if ! kill -0 $PID 2>/dev/null; then break; fi
            sleep 1
          done
          if kill -0 $PID 2>/dev/null; then
            kill $PID 2>/dev/null
            echo "TIMEOUT waiting for the meteor"
            cat "/tmp/meteor-smoke.log"
            exit 1
          fi
          grep -q "METEOR_STARTED" "/tmp/meteor-smoke.log" || { echo "no METEOR_STARTED"; cat "/tmp/meteor-smoke.log"; exit 1; }
          grep -q "METEOR_PANEL_CREATED.*contentView=1" "/tmp/meteor-smoke.log" || { echo "meteor head asset not rendered"; cat "/tmp/meteor-smoke.log"; exit 1; }
          grep -q "METEOR_ORDERED_FRONT" "/tmp/meteor-smoke.log" || { echo "no METEOR_ORDERED_FRONT"; cat "/tmp/meteor-smoke.log"; exit 1; }
          grep -q "METEOR_PATH_RESOLVED" "/tmp/meteor-smoke.log" || { echo "no METEOR_PATH_RESOLVED"; cat "/tmp/meteor-smoke.log"; exit 1; }
          grep -q "METEOR_FLIGHT_BEGAN" "/tmp/meteor-smoke.log" || { echo "no METEOR_FLIGHT_BEGAN"; cat "/tmp/meteor-smoke.log"; exit 1; }
          grep -q "METEOR_FRAME" "/tmp/meteor-smoke.log" || { echo "no METEOR_FRAME"; cat "/tmp/meteor-smoke.log"; exit 1; }
          grep -q "METEOR_DEPARTED" "/tmp/meteor-smoke.log" || { echo "no METEOR_DEPARTED"; cat "/tmp/meteor-smoke.log"; exit 1; }
          grep -q "METEOR_WISHING_BEGAN" "/tmp/meteor-smoke.log" || { echo "no METEOR_WISHING_BEGAN"; cat "/tmp/meteor-smoke.log"; exit 1; }
          grep -q "METEOR_CELEBRATION_BEGAN" "/tmp/meteor-smoke.log" || { echo "no METEOR_CELEBRATION_BEGAN"; cat "/tmp/meteor-smoke.log"; exit 1; }
          grep -q "METEOR_CLEANED_UP" "/tmp/meteor-smoke.log" || { echo "no METEOR_CLEANED_UP"; cat "/tmp/meteor-smoke.log"; exit 1; }
          grep -q "METEOR_COMPLETED" "/tmp/meteor-smoke.log" || { echo "no METEOR_COMPLETED"; cat "/tmp/meteor-smoke.log"; exit 1; }
          grep -q "EVENT_ATTENTION_ACQUIRED" "/tmp/meteor-smoke.log" || { echo "no attention acquisition"; cat "/tmp/meteor-smoke.log"; exit 1; }
          grep -q "EVENT_ATTENTION_RELEASED" "/tmp/meteor-smoke.log" || { echo "no attention release"; cat "/tmp/meteor-smoke.log"; exit 1; }
          grep -q "METEOR_SCALE_INVALID" "/tmp/meteor-smoke.log" && { echo "invalid meteor scale"; cat "/tmp/meteor-smoke.log"; exit 1; }
          echo "METEOR_SMOKE_OK"

      - name: Diagnose first-launch decision (packaged app)
        run: |
          BIN="dist/WarawaraPet.app/Contents/MacOS/WarawaraPet"
          OUT="$("$BIN" --diagnose-first-launch 2>&1)"
          echo "$OUT"
          echo "$OUT" | grep -q "FIRST_LAUNCH_PROFILE" || { echo "no FIRST_LAUNCH_PROFILE"; exit 1; }
          echo "$OUT" | grep -q "FIRST_LAUNCH_ELIGIBLE" || { echo "no FIRST_LAUNCH_ELIGIBLE"; exit 1; }
          echo "FIRST_LAUNCH_DIAGNOSE_OK"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WarawaraPet-macOS
          path: dist/WarawaraPet.zip
          retention-days: 30

      - name: Upload art preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: WarawaraPet-Art-Preview
          path: dist/art-preview
          retention-days: 30

      - name: Upload birthday preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: WarawaraPet-Birthday-Preview
          path: dist/birthday-preview
          retention-days: 30

      - name: Upload gift preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: WarawaraPet-Gift-Preview
          path: dist/gift-preview
          retention-days: 30

      - name: Upload sleep/mouth preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: WarawaraPet-Sleep-Mouth-Preview
          path: dist/sleep-preview
          retention-days: 30
