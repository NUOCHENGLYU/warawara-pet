name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, test, and package
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build (universal)
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Run unit tests
        run: swift test

      - name: Generate art previews
        run: swift test --filter ArtPreviewGeneratorTests
        env:
          ART_PREVIEW_OUT: dist/art-preview

      - name: Generate birthday previews
        run: swift test --filter BirthdayPreviewGeneratorTests
        env:
          BIRTHDAY_PREVIEW_OUT: dist/birthday-preview

      - name: Generate seasonal previews
        run: swift test --filter SeasonalPreviewGeneratorTests
        env:
          SEASONAL_PREVIEW_OUT: dist/seasonal-preview

      - name: Package .app and zip
        run: bash Scripts/package-app.sh

      - name: Verify packaged app loads sprites
        run: |
          OUTPUT="$("dist/WarawaraPet.app/Contents/MacOS/WarawaraPet" --verify-sprites)"
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "SPRITES_OK" || { echo "sprites not loaded"; exit 1; }
          echo "$OUTPUT" | grep -q "rig=loaded" || { echo "layered rig not loaded"; exit 1; }
          BIRTHDAY="$("dist/WarawaraPet.app/Contents/MacOS/WarawaraPet" --verify-birthday)"
          echo "$BIRTHDAY"
          echo "$BIRTHDAY" | grep -q "BIRTHDAY_OK" || { echo "birthday assets not loaded"; exit 1; }
          EVENTS="$("dist/WarawaraPet.app/Contents/MacOS/WarawaraPet" --verify-event-assets)"
          echo "$EVENTS"
          echo "$EVENTS" | grep -q "EVENT_ASSETS_OK" || { echo "seasonal assets not loaded"; exit 1; }

      - name: Smoke-test event replays (packaged app)
        run: |
          BIN="dist/WarawaraPet.app/Contents/MacOS/WarawaraPet"
          for KIND in cny christmas newyear umbrella hot-cocoa sprout paper-airplane; do
            echo "== replay-smoke $KIND =="
            "$BIN" --replay-smoke "$KIND" > "/tmp/replay-$KIND.log" 2>&1 &
            PID=$!
            for i in $(seq 1 120); do
              if ! kill -0 $PID 2>/dev/null; then break; fi
              sleep 1
            done
            if kill -0 $PID 2>/dev/null; then
              kill $PID 2>/dev/null
              echo "TIMEOUT waiting for $KIND"
              cat "/tmp/replay-$KIND.log"
              exit 1
            fi
            grep -q "EVENT_REPLAY_STARTED" "/tmp/replay-$KIND.log" || { echo "no STARTED for $KIND"; cat "/tmp/replay-$KIND.log"; exit 1; }
            grep -q "EVENT_REPLAY_VISIBLE" "/tmp/replay-$KIND.log" || { echo "no VISIBLE for $KIND"; cat "/tmp/replay-$KIND.log"; exit 1; }
            grep -q "EVENT_ASSET_LOADED" "/tmp/replay-$KIND.log" || { echo "no ASSET_LOADED for $KIND"; cat "/tmp/replay-$KIND.log"; exit 1; }
            grep -q "EVENT_WINDOW_PRESENTED" "/tmp/replay-$KIND.log" || { echo "no WINDOW_PRESENTED for $KIND"; cat "/tmp/replay-$KIND.log"; exit 1; }
            if grep -q "EVENT_SCENE_FAILED" "/tmp/replay-$KIND.log"; then
              echo "scene failure for $KIND"
              cat "/tmp/replay-$KIND.log"
              exit 1
            fi
            grep -q "EVENT_REPLAY_COMPLETED" "/tmp/replay-$KIND.log" || { echo "no COMPLETED for $KIND"; cat "/tmp/replay-$KIND.log"; exit 1; }
            grep -q "EVENT_FINISHED" "/tmp/replay-$KIND.log" || { echo "no FINISHED for $KIND"; cat "/tmp/replay-$KIND.log"; exit 1; }
            echo "SMOKE_OK $KIND"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WarawaraPet-macOS
          path: dist/WarawaraPet.zip
          retention-days: 30

      - name: Upload art preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: WarawaraPet-Art-Preview
          path: dist/art-preview
          retention-days: 30

      - name: Upload birthday preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: WarawaraPet-Birthday-Preview
          path: dist/birthday-preview
          retention-days: 30

      - name: Upload seasonal preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: WarawaraPet-Seasonal-Daily-Preview
          path: dist/seasonal-preview
          retention-days: 30
