name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, test, and package
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build (universal)
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Run unit tests
        run: swift test

      - name: Generate art previews
        run: swift test --filter ArtPreviewGeneratorTests
        env:
          ART_PREVIEW_OUT: dist/art-preview

      - name: Generate birthday previews
        run: swift test --filter BirthdayPreviewGeneratorTests
        env:
          BIRTHDAY_PREVIEW_OUT: dist/birthday-preview

      - name: Generate gift previews
        run: swift test --filter GiftPreviewGeneratorTests
        env:
          GIFT_PREVIEW_OUT: dist/gift-preview

      - name: Package .app and zip
        run: bash Scripts/package-app.sh

      - name: Verify packaged app loads sprites
        run: |
          OUTPUT="$("dist/WarawaraPet.app/Contents/MacOS/WarawaraPet" --verify-sprites)"
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "SPRITES_OK" || { echo "sprites not loaded"; exit 1; }
          echo "$OUTPUT" | grep -q "rig=loaded" || { echo "layered rig not loaded"; exit 1; }
          BIRTHDAY="$("dist/WarawaraPet.app/Contents/MacOS/WarawaraPet" --verify-birthday)"
          echo "$BIRTHDAY"
          echo "$BIRTHDAY" | grep -q "BIRTHDAY_OK" || { echo "birthday assets not loaded"; exit 1; }
          GIFTS="$("dist/WarawaraPet.app/Contents/MacOS/WarawaraPet" --verify-gift-assets)"
          echo "$GIFTS"
          echo "$GIFTS" | grep -q "GIFT_ASSETS_OK" || { echo "gift assets not loaded"; exit 1; }

      - name: Smoke-test meteor replay (packaged app)
        run: |
          BIN="dist/WarawaraPet.app/Contents/MacOS/WarawaraPet"
          echo "== replay-smoke meteor =="
          "$BIN" --replay-smoke > "/tmp/meteor-smoke.log" 2>&1 &
          PID=$!
          for i in $(seq 1 60); do
            if ! kill -0 $PID 2>/dev/null; then break; fi
            sleep 1
          done
          if kill -0 $PID 2>/dev/null; then
            kill $PID 2>/dev/null
            echo "TIMEOUT waiting for the meteor"
            cat "/tmp/meteor-smoke.log"
            exit 1
          fi
          grep -q "METEOR_STARTED" "/tmp/meteor-smoke.log" || { echo "no METEOR_STARTED"; cat "/tmp/meteor-smoke.log"; exit 1; }
          grep -q "METEOR_PANEL_CREATED" "/tmp/meteor-smoke.log" || { echo "no METEOR_PANEL_CREATED"; cat "/tmp/meteor-smoke.log"; exit 1; }
          grep -q "METEOR_ORDERED_FRONT" "/tmp/meteor-smoke.log" || { echo "no METEOR_ORDERED_FRONT"; cat "/tmp/meteor-smoke.log"; exit 1; }
          grep -q "METEOR_PATH_RESOLVED" "/tmp/meteor-smoke.log" || { echo "no METEOR_PATH_RESOLVED"; cat "/tmp/meteor-smoke.log"; exit 1; }
          grep -q "METEOR_FLIGHT_BEGAN" "/tmp/meteor-smoke.log" || { echo "no METEOR_FLIGHT_BEGAN"; cat "/tmp/meteor-smoke.log"; exit 1; }
          grep -q "METEOR_FRAME" "/tmp/meteor-smoke.log" || { echo "no METEOR_FRAME"; cat "/tmp/meteor-smoke.log"; exit 1; }
          grep -q "METEOR_DEPARTED" "/tmp/meteor-smoke.log" || { echo "no METEOR_DEPARTED"; cat "/tmp/meteor-smoke.log"; exit 1; }
          grep -q "METEOR_WISHING_BEGAN" "/tmp/meteor-smoke.log" || { echo "no METEOR_WISHING_BEGAN"; cat "/tmp/meteor-smoke.log"; exit 1; }
          grep -q "METEOR_CELEBRATION_BEGAN" "/tmp/meteor-smoke.log" || { echo "no METEOR_CELEBRATION_BEGAN"; cat "/tmp/meteor-smoke.log"; exit 1; }
          grep -q "METEOR_CLEANED_UP" "/tmp/meteor-smoke.log" || { echo "no METEOR_CLEANED_UP"; cat "/tmp/meteor-smoke.log"; exit 1; }
          grep -q "METEOR_COMPLETED" "/tmp/meteor-smoke.log" || { echo "no METEOR_COMPLETED"; cat "/tmp/meteor-smoke.log"; exit 1; }
          grep -q "EVENT_ATTENTION_ACQUIRED" "/tmp/meteor-smoke.log" || { echo "no attention acquisition"; cat "/tmp/meteor-smoke.log"; exit 1; }
          grep -q "EVENT_ATTENTION_RELEASED" "/tmp/meteor-smoke.log" || { echo "no attention release"; cat "/tmp/meteor-smoke.log"; exit 1; }
          echo "METEOR_SMOKE_OK"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WarawaraPet-macOS
          path: dist/WarawaraPet.zip
          retention-days: 30

      - name: Upload art preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: WarawaraPet-Art-Preview
          path: dist/art-preview
          retention-days: 30

      - name: Upload birthday preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: WarawaraPet-Birthday-Preview
          path: dist/birthday-preview
          retention-days: 30

      - name: Upload gift preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: WarawaraPet-Gift-Preview
          path: dist/gift-preview
          retention-days: 30
