name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, test, and package
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build (universal)
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Run unit tests
        run: swift test

      - name: Package .app and zip
        run: bash Scripts/package-app.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WarawaraPet-macOS
          path: dist/WarawaraPet.zip
          retention-days: 30
